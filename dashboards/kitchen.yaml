## Kitchen Wall Display — Lovelace Dashboard
##
## REQUIRED HACS INSTALLS:
##   Lovelace cards (HACS → Frontend):
##   - mushroom           https://github.com/piitaya/lovelace-mushroom
##   - card-mod           https://github.com/thomasloven/lovelace-card-mod
##   - kiosk-mode         https://github.com/maykar0/kiosk-mode
##   - simple-clock-card  https://github.com/wassy92x/lovelace-simple-clock-card
##
##   Custom Integration (HACS → Integrations — NOT Frontend):
##   - aurora-calendar    https://github.com/davidlop28/ha-aurora-calendar
##     After installing: restart HA, then go to
##     Settings → Devices & Services → Add Integration → search "Aurora Calendar"
##     Configure it with your HA calendar entities there (colors/names set in the integration)
##
## HOW TO LOAD INTO HA:
##   Settings → Dashboards → Add Dashboard (or edit existing "Kitchen")
##   Paste this YAML via the dashboard YAML editor.
##
## KIOSK MODE:
##   Access the dashboard at:  http://homeassistant.local:8123/kitchen/home?kiosk
##   The ?kiosk query parameter hides the HA header and sidebar automatically.

title: Kitchen
views:
  - title: Home
    path: home
    type: panel
    cards:
      - type: vertical-stack
        cards:

          ## ── HEADER ROW: Weather · Date · Clock ──────────────────────────────
          ## KIOSK MODE: no card needed — kiosk-mode activates automatically
          ## when the URL includes ?kiosk. Access at:
          ##   http://homeassistant.local:8123/kitchen/home?kiosk
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-chips-card
                chips:
                  - type: template
                    icon: mdi:weather-partly-cloudy
                    content: >-
                      {{ states('weather.forecast_home')
                        | replace('partlycloudy', 'Partly Cloudy')
                        | replace('sunny', 'Sunny')
                        | replace('cloudy', 'Cloudy')
                        | replace('rainy', 'Rainy')
                        | replace('snowy', 'Snowy')
                        | replace('windy', 'Windy')
                        | replace('fog', 'Foggy')
                        | replace('clear-night', 'Clear') }}
                        · {{ state_attr('weather.forecast_home', 'temperature') | round(0) }}°F
                    icon_color: amber
                  - type: template
                    icon: mdi:calendar
                    content: "{{ now().strftime('%A, %B %-d') }}"
                    icon_color: blue
                alignment: start
                card_mod:
                  style: |
                    ha-card {
                      background: none;
                      box-shadow: none;
                      border: none;
                      --chip-font-size: 1.15em;
                      --chip-icon-size: 1.3em;
                      --chip-height: 44px;
                    }
              - type: custom:mushroom-template-card
                primary: ""
                secondary: ""
                card_mod:
                  style: |
                    ha-card { background: none; box-shadow: none; border: none; }
              - type: custom:simple-clock-card
                time_format: "%-I:%M %p"
                show_date: false
                card_mod:
                  style: |
                    ha-card {
                      background: none;
                      box-shadow: none;
                      border: none;
                      text-align: right;
                      font-size: 2.2em;
                      font-weight: 600;
                    }

          ## ── PERSON PRESENCE ─────────────────────────────────────────────────
          ## Border color: home = person color, away = red, unknown = gray
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-person-card
                entity: person.jimmy
                layout: vertical
                icon_type: entity-picture
                tap_action:
                  action: navigate
                  navigation_path: /kitchen/jimmy
                card_mod:
                  style:
                    mushroom-shape-avatar$: |
                      .picture {
                        border: 5px solid
                          {% if is_state('person.jimmy', 'home') %}#8e44ad
                          {% elif is_state('person.jimmy', 'unknown') %}#95a5a6
                          {% else %}#e74c3c{% endif %} !important;
                      }
                    .: |
                      ha-card {
                        background-color: unset;
                        padding: 5px !important;
                        --icon-size: 6em;
                        --icon-border-radius: 4.5em;
                        --card-primary-font-size: 1.3em;
                        --card-secondary-font-size: 0.9em;
                      }
                      mushroom-badge-icon {
                        --badge-icon-size: 16px;
                        --badge-size: 26px;
                      }

              - type: custom:mushroom-person-card
                entity: person.shirin
                layout: vertical
                icon_type: entity-picture
                tap_action:
                  action: navigate
                  navigation_path: /kitchen/shirin
                card_mod:
                  style:
                    mushroom-shape-avatar$: |
                      .picture {
                        border: 5px solid
                          {% if is_state('person.shirin', 'home') %}#27ae60
                          {% elif is_state('person.shirin', 'unknown') %}#95a5a6
                          {% else %}#e74c3c{% endif %} !important;
                      }
                    .: |
                      ha-card {
                        background-color: unset;
                        padding: 5px !important;
                        --icon-size: 6em;
                        --icon-border-radius: 4.5em;
                        --card-primary-font-size: 1.3em;
                        --card-secondary-font-size: 0.9em;
                      }
                      mushroom-badge-icon {
                        --badge-icon-size: 16px;
                        --badge-size: 26px;
                      }

              - type: custom:mushroom-person-card
                entity: person.river
                layout: vertical
                icon_type: entity-picture
                tap_action:
                  action: navigate
                  navigation_path: /kitchen/river
                card_mod:
                  style:
                    mushroom-shape-avatar$: |
                      .picture {
                        border: 5px solid
                          {% if is_state('person.river', 'home') %}#e74c3c
                          {% elif is_state('person.river', 'unknown') %}#95a5a6
                          {% else %}#e74c3c{% endif %} !important;
                      }
                    .: |
                      ha-card {
                        background-color: unset;
                        padding: 5px !important;
                        --icon-size: 6em;
                        --icon-border-radius: 4.5em;
                        --card-primary-font-size: 1.3em;
                        --card-secondary-font-size: 0.9em;
                      }
                      mushroom-badge-icon {
                        --badge-icon-size: 16px;
                        --badge-size: 26px;
                      }

          ## ── WEEKLY CALENDAR (aurora-calendar) ───────────────────────────────
          ## aurora-calendar is a CUSTOM INTEGRATION, not a Lovelace card.
          ## Install steps:
          ##   1. HACS → Integrations → ⋮ → Custom Repositories
          ##      URL: https://github.com/davidlop28/ha-aurora-calendar
          ##      Category: Integration
          ##   2. Download and restart HA
          ##   3. Settings → Devices & Services → Add Integration → "Aurora Calendar"
          ##   4. In the integration setup, add your calendar entities and set
          ##      their colors (calendar.family, .jimmy, .shirin, .river, .meals)
          ##
          ## The card below then reads config from the integration automatically.
          ## Use the card's built-in visual editor (pencil icon) to adjust
          ## hour range, font size, weather overlay, background style, etc.
          - type: custom:aurora-calendar-card
            integration: aurora_calendar
            week_start: sunday
            show_weather: true
            visible_start_hour: 6
            visible_end_hour: 22
            time_format: 12h
            show_event_time: true
            dim_past_events: true
            height_mode: auto

          ## ── MEALS + GROCERY LIST ────────────────────────────────────────────
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Today's Meals

                  - type: custom:mushroom-template-card
                    primary: Lunch
                    secondary: "{{ states('sensor.mealie_lunch_today') }}"
                    icon: mdi:food-fork-drink
                    icon_color: orange
                    multiline_secondary: true
                    tap_action:
                      action: url
                      url_path: https://mealie.jewellpl.com/household/mealplan/planner/view

                  - type: custom:mushroom-template-card
                    primary: Dinner
                    secondary: "{{ states('sensor.mealie_dinner_today') }}"
                    icon: mdi:silverware-fork-knife
                    icon_color: deep-orange
                    multiline_secondary: true
                    tap_action:
                      action: url
                      url_path: https://mealie.jewellpl.com/household/mealplan/planner/view

              - type: todo-list
                entity: todo.mealie_groceries
                title: Groceries
