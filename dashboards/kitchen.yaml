## Kitchen Wall Display — Lovelace Dashboard
##
## REQUIRED HACS CARDS (install all before using this dashboard):
##   - mushroom           https://github.com/piitaya/lovelace-mushroom
##   - aurora-calendar    https://github.com/davidlop28/ha-aurora-calendar
##   - card-mod           https://github.com/thomasloven/lovelace-card-mod
##   - kiosk-mode         https://github.com/maykar0/kiosk-mode
##   - simple-clock-card  https://github.com/wassy92x/lovelace-simple-clock-card
##
## HOW TO LOAD INTO HA:
##   Settings → Dashboards → Add Dashboard (or edit existing "Kitchen")
##   Paste this YAML via the dashboard YAML editor.
##
## KIOSK MODE:
##   Access the dashboard at:  http://homeassistant.local:8123/kitchen/home?kiosk
##   The ?kiosk query parameter hides the HA header and sidebar automatically.

title: Kitchen
views:
  - title: Home
    path: home
    type: panel
    cards:
      - type: vertical-stack
        cards:

          ## ── KIOSK MODE ──────────────────────────────────────────────────────
          ## Hides HA header and sidebar when ?kiosk is in the URL.
          ## Remove this card if you do NOT want kiosk mode.
          - type: custom:kiosk-mode
            kiosk_mode:
              query_strings:
                - value: kiosk
                  hide_header: true
                  hide_sidebar: true

          ## ── HEADER ROW: Weather · Date · Clock ──────────────────────────────
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-chips-card
                chips:
                  - type: template
                    icon: mdi:weather-partly-cloudy
                    content: >-
                      {{ states('weather.forecast_home')
                        | replace('partlycloudy', 'Partly Cloudy')
                        | replace('sunny', 'Sunny')
                        | replace('cloudy', 'Cloudy')
                        | replace('rainy', 'Rainy')
                        | replace('snowy', 'Snowy')
                        | replace('windy', 'Windy')
                        | replace('fog', 'Foggy')
                        | replace('clear-night', 'Clear') }}
                        · {{ state_attr('weather.forecast_home', 'temperature') | round(0) }}°F
                    icon_color: amber
                  - type: template
                    icon: mdi:calendar
                    content: "{{ now().strftime('%A, %B %-d') }}"
                    icon_color: blue
                alignment: start
                card_mod:
                  style: |
                    ha-card {
                      background: none;
                      box-shadow: none;
                      border: none;
                      --chip-font-size: 1.15em;
                      --chip-icon-size: 1.3em;
                      --chip-height: 44px;
                    }
              - type: custom:mushroom-template-card
                primary: ""
                secondary: ""
                card_mod:
                  style: |
                    ha-card { background: none; box-shadow: none; border: none; }
              - type: custom:simple-clock-card
                time_format: "%-I:%M %p"
                show_date: false
                card_mod:
                  style: |
                    ha-card {
                      background: none;
                      box-shadow: none;
                      border: none;
                      text-align: right;
                      font-size: 2.2em;
                      font-weight: 600;
                    }

          ## ── PERSON PRESENCE ─────────────────────────────────────────────────
          ## Border color: home = person color, away = red, unknown = gray
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-person-card
                entity: person.jimmy
                layout: vertical
                icon_type: entity-picture
                tap_action:
                  action: navigate
                  navigation_path: /kitchen/jimmy
                card_mod:
                  style:
                    mushroom-shape-avatar$: |
                      .picture {
                        border: 5px solid
                          {% if is_state('person.jimmy', 'home') %}#8e44ad
                          {% elif is_state('person.jimmy', 'unknown') %}#95a5a6
                          {% else %}#e74c3c{% endif %} !important;
                      }
                    .: |
                      ha-card {
                        background-color: unset;
                        padding: 5px !important;
                        --icon-size: 6em;
                        --icon-border-radius: 4.5em;
                        --card-primary-font-size: 1.3em;
                        --card-secondary-font-size: 0.9em;
                      }
                      mushroom-badge-icon {
                        --badge-icon-size: 16px;
                        --badge-size: 26px;
                      }

              - type: custom:mushroom-person-card
                entity: person.shirin
                layout: vertical
                icon_type: entity-picture
                tap_action:
                  action: navigate
                  navigation_path: /kitchen/shirin
                card_mod:
                  style:
                    mushroom-shape-avatar$: |
                      .picture {
                        border: 5px solid
                          {% if is_state('person.shirin', 'home') %}#27ae60
                          {% elif is_state('person.shirin', 'unknown') %}#95a5a6
                          {% else %}#e74c3c{% endif %} !important;
                      }
                    .: |
                      ha-card {
                        background-color: unset;
                        padding: 5px !important;
                        --icon-size: 6em;
                        --icon-border-radius: 4.5em;
                        --card-primary-font-size: 1.3em;
                        --card-secondary-font-size: 0.9em;
                      }
                      mushroom-badge-icon {
                        --badge-icon-size: 16px;
                        --badge-size: 26px;
                      }

              - type: custom:mushroom-person-card
                entity: person.river
                layout: vertical
                icon_type: entity-picture
                tap_action:
                  action: navigate
                  navigation_path: /kitchen/river
                card_mod:
                  style:
                    mushroom-shape-avatar$: |
                      .picture {
                        border: 5px solid
                          {% if is_state('person.river', 'home') %}#e74c3c
                          {% elif is_state('person.river', 'unknown') %}#95a5a6
                          {% else %}#e74c3c{% endif %} !important;
                      }
                    .: |
                      ha-card {
                        background-color: unset;
                        padding: 5px !important;
                        --icon-size: 6em;
                        --icon-border-radius: 4.5em;
                        --card-primary-font-size: 1.3em;
                        --card-secondary-font-size: 0.9em;
                      }
                      mushroom-badge-icon {
                        --badge-icon-size: 16px;
                        --badge-size: 26px;
                      }

          ## ── WEEKLY CALENDAR (aurora-calendar) ───────────────────────────────
          ## Replaces week-planner-card with aurora-calendar for richer UI:
          ##   - Event creation/editing from the display
          ##   - Drag-to-reschedule
          ##   - Weather forecast overlay in the header
          ##   - Multiple view modes (tap the header to switch week ↔ month)
          ##
          ## Install aurora-calendar via HACS → Custom Repositories:
          ##   URL: https://github.com/davidlop28/ha-aurora-calendar
          ##   Category: Lovelace
          ##
          ## After installing, the card has a built-in visual editor — use it
          ## to fine-tune display options (fonts, hours range, background, etc.)
          - type: custom:aurora-calendar-card
            view_mode: week
            show_weather: true
            weather_entity: weather.forecast_home
            start_hour: 6
            end_hour: 22
            show_filters: true
            entities:
              - calendar: calendar.family
                color: "#3498db"
                name: Family
              - calendar: calendar.jimmy
                color: "#8e44ad"
                name: Jimmy
              - calendar: calendar.shirin
                color: "#27ae60"
                name: Shirin
              - calendar: calendar.river
                color: "#e74c3c"
                name: River
              - calendar: calendar.meals
                color: "#f39c12"
                name: Meals

          ## ── MEALS + GROCERY LIST ────────────────────────────────────────────
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Today's Meals

                  - type: custom:mushroom-template-card
                    primary: Lunch
                    secondary: "{{ states('sensor.mealie_lunch_today') }}"
                    icon: mdi:food-fork-drink
                    icon_color: orange
                    multiline_secondary: true
                    tap_action:
                      action: url
                      url_path: https://mealie.jewellpl.com/household/mealplan/planner/view

                  - type: custom:mushroom-template-card
                    primary: Dinner
                    secondary: "{{ states('sensor.mealie_dinner_today') }}"
                    icon: mdi:silverware-fork-knife
                    icon_color: deep-orange
                    multiline_secondary: true
                    tap_action:
                      action: url
                      url_path: https://mealie.jewellpl.com/household/mealplan/planner/view

              - type: todo-list
                entity: todo.mealie_groceries
                title: Groceries
